services:
  redis:
    image: redis/redis-stack-server:7.4.0-v0
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mock-pi:
    build: .
    command: uvicorn mock_pi_server:app --host 0.0.0.0 --port 8080
    ports:
      - "8080:8080"

  integration:
    build: .
    depends_on:
      redis:
        condition: service_healthy
      mock-pi:
        condition: service_started
    environment:
      PI_BASE_URL: http://mock-pi:8080/piwebapi
      PI_AUTH_MODE: none
      PI_POINTS: '\\PISRV01\PlantA_Generator01_Temperature,\\PISRV01\PlantA_Generator02_Temperature,\\PISRV01\PlantB_Generator03_Temperature,\\PISRV01\PlantA_Generator01_Power,\\PISRV01\PlantA_Generator02_Power,\\PISRV01\PlantB_Generator03_Power,\\PISRV01\PlantA_Generator01_Vibration,\\PISRV01\PlantB_Generator03_Vibration'
      POLL_INTERVAL_SECONDS: "5"
      BACKFILL_START_MINUTES: "60"
      RECORDED_MAX_COUNT: "5000"
      HEALTH_PORT: "9100"
      REDIS_URL: redis://redis:6379/0
      REDIS_KEY_PREFIX: pi
      REDIS_TS_RETENTION_MS: "604800000"
      DOWNSAMPLE_ENABLED: "true"
      DOWNSAMPLE_BUCKET_MS: "60000"
      DOWNSAMPLE_AGGREGATION: avg
    ports:
      - "9100:9100"
    command: python main.py

  dashboard:
    build: .
    depends_on:
      redis:
        condition: service_healthy
      integration:
        condition: service_started
    environment:
      REDIS_URL: redis://redis:6379/0
      REDIS_KEY_PREFIX: pi
    ports:
      - "3000:3000"
    command: uvicorn dashboard:app --host 0.0.0.0 --port 3000

volumes:
  redis-data:
